<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101f"><link rel="manifest" href="/manifest.webmanifest"><title>Finanças</title>
<style>
:root{--bg:#07101f;--p:#101a2e;--p2:#15223b;--t:#f7f9ff;--m:#9aa8c0;--a:#4f8cff;--ok:#37d39a;--bad:#ff6b83;--line:#263553}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#07101f,#0a1221);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.shell{max-width:760px;margin:auto;padding:16px 14px 100px}.hidden{display:none!important}.login{min-height:86vh;display:grid;place-items:center;text-align:center}.logo{width:76px;height:76px;border-radius:24px;background:linear-gradient(135deg,#4f8cff,#765cff);display:grid;place-items:center;font-size:34px;margin:auto}.login h1{font-size:30px;margin:18px 0 6px}.login p{color:var(--m);max-width:430px;line-height:1.5}.people{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 12px}.person{border:1px solid var(--line);background:var(--p);color:white;border-radius:16px;padding:15px;font-weight:800;font-size:16px}.person.selected{outline:2px solid var(--a);background:#152847}.pinrow{display:flex;gap:8px}.pinrow input{flex:1;background:#0d1728;border:1px solid var(--line);border-radius:14px;padding:14px;color:white;font-size:16px}.enter{border:0;background:var(--a);color:white;border-radius:14px;padding:0 20px;font-weight:800}.loginerr{color:#ff91a5;font-size:12px;min-height:18px;margin-top:8px}.top{position:sticky;top:0;background:#07101fef;backdrop-filter:blur(16px);z-index:5;padding:12px 0;border-bottom:1px solid var(--line)}.row{display:flex;align-items:center;gap:10px}.brand{font-weight:800;font-size:18px}.sub{font-size:12px;color:var(--m)}.who{margin-left:auto;background:#16223a;border:1px solid var(--line);padding:7px 10px;border-radius:999px;font-size:12px}.logout{border:0;background:#1a2232;color:#dce5f5;border-radius:10px;padding:8px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.card{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:12px}.card small{display:block;color:var(--m);margin-bottom:6px}.ok{color:var(--ok)}.bad{color:var(--bad)}.hint{font-size:12px;color:#b6c3d8;background:#101a2c;border:1px dashed #34496e;padding:12px;border-radius:14px}.chat{display:flex;flex-direction:column;gap:9px;padding:12px 0 110px}.bubble{max-width:88%;padding:11px 13px;border-radius:17px;line-height:1.4;white-space:pre-wrap}.me{align-self:flex-end;background:#2c68df}.bot{align-self:flex-start;background:var(--p2);border:1px solid var(--line)}.composer{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;width:min(730px,calc(100% - 28px));display:flex;gap:8px;background:#0c1526;border:1px solid var(--line);padding:8px;border-radius:20px;z-index:10}.composer input{flex:1;background:transparent;border:0;color:white;outline:0;padding:10px;font-size:15px}.icon,.send{width:42px;height:42px;border:0;border-radius:14px;background:#192944;color:white;font-size:18px}.send{background:var(--a)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#08101fee;border-top:1px solid var(--line);padding:6px;z-index:12}.nav button{border:0;background:transparent;color:#8393ad;padding:8px;font-size:11px}.nav b{display:block;font-size:18px}.nav .active{color:#74a4ff}.section h2{font-size:20px}.tx,.cat,.alert{background:var(--p);border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:8px}.tx{display:flex;gap:10px;align-items:center}.txmain{flex:1}.txmain b{display:block;font-size:14px}.txmain small{color:var(--m)}.amt{font-weight:800}.catline{display:flex;justify-content:space-between}.bar{height:8px;background:#111a2d;border-radius:999px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#4f8cff,#50ddb3)}.alert p{margin:5px 0 0;color:#c0cadb;font-size:12px}.empty{text-align:center;color:var(--m);padding:30px 10px}.busy{opacity:.55;pointer-events:none}@media(max-width:430px){.people{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.cards .card:last-child{grid-column:1/-1}}
</style></head>
<body><div class="shell">
<div id="login" class="login"><div><div class="logo">↗</div><h1>Seu dinheiro, em conversa.</h1><p>Agora os lançamentos ficam salvos no banco, separados entre Thiago e Rebeca.</p><div class="people"><button id="uThiago" class="person selected" onclick="selectUser('thiago')">Thiago</button><button id="uRebeca" class="person" onclick="selectUser('rebeca')">Rebeca</button></div><div class="pinrow"><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN"><button class="enter" onclick="login()">Entrar</button></div><div id="loginerr" class="loginerr"></div></div></div>
<div id="app" class="hidden"><header class="top"><div class="row"><div><div class="brand">Finanças</div><div class="sub" id="hello"></div></div><div class="who" id="today"></div><button class="logout" onclick="logout()">Sair</button></div></header><div id="summary" class="cards"></div><main>
<section id="chatView"><div class="hint">Ex.: “Gastei R$ 100 de diesel no posto”, “Recebi R$ 2.500 hoje”, “Quanto gastei de diesel este mês?”</div><div id="chat" class="chat"></div><div id="composer" class="composer"><button class="icon" id="mic" onclick="voice()">🎙️</button><input id="msg" placeholder="Fale ou escreva sobre suas finanças…"><button class="send" onclick="send()">➤</button></div></section>
<section id="dashView" class="section hidden"><h2>Resumo do mês</h2><div id="cats"></div></section><section id="movesView" class="section hidden"><h2>Movimentos</h2><div id="moves"></div></section><section id="alertsView" class="section hidden"><h2>Radar financeiro</h2><div id="alerts"></div></section></main></div></div>
<nav id="nav" class="nav hidden"><button class="active" onclick="show('chat',this)"><b>💬</b>Chat</button><button onclick="show('dash',this)"><b>◫</b>Resumo</button><button onclick="show('moves',this)"><b>↕</b>Movimentos</button><button onclick="show('alerts',this)"><b>◎</b>Radar</button></nav>
<script>
let selectedUser='thiago',me=null,state={summary:null,messages:[],transactions:[],alerts:[]};const $=s=>document.querySelector(s),money=c=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format((c||0)/100),esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function api(url,opt={}){let r=await fetch(url,{credentials:'same-origin',headers:{'content-type':'application/json',...(opt.headers||{})},...opt});let b={};try{b=await r.json()}catch{}if(!r.ok){let e=new Error(b.error||`HTTP ${r.status}`);e.status=r.status;throw e}return b}
function selectUser(u){selectedUser=u;$('#uThiago').classList.toggle('selected',u==='thiago');$('#uRebeca').classList.toggle('selected',u==='rebeca');$('#pin').focus()}
async function login(){try{$('#loginerr').textContent='';let b=await api('/api/login',{method:'POST',body:JSON.stringify({user:selectedUser,pin:$('#pin').value})});me=b.user;$('#pin').value='';enterApp();await refresh()}catch(e){$('#loginerr').textContent=e.status===401?'PIN incorreto.':'Não consegui entrar. Tente novamente.'}}
async function logout(){await api('/api/logout',{method:'POST'}).catch(()=>{});me=null;location.reload()}
function enterApp(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#nav').classList.remove('hidden');$('#hello').textContent=`Olá, ${me.name}`;$('#today').textContent=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});}
async function refresh(){let [summary,chat,tx,radar]=await Promise.all([api('/api/summary'),api('/api/chat'),api('/api/transactions'),api('/api/radar')]);state.summary=summary;state.messages=chat.messages;state.transactions=tx.transactions;state.alerts=radar.alerts;render()}
function render(){let s=state.summary||{incomeCents:0,expenseCents:0,balanceCents:0,categories:[]};$('#summary').innerHTML=`<div class=card><small>Entradas</small><strong class=ok>${money(s.incomeCents)}</strong></div><div class=card><small>Saídas</small><strong class=bad>${money(s.expenseCents)}</strong></div><div class=card><small>Saldo</small><strong class=${s.balanceCents>=0?'ok':'bad'}>${money(s.balanceCents)}</strong></div>`;$('#chat').innerHTML=state.messages.length?state.messages.map(x=>`<div class="bubble ${x.role==='user'?'me':'bot'}">${esc(x.content)}</div>`).join(''):`<div class="bubble bot">Olá, ${esc(me?.name||'')}. Me diga uma entrada ou gasto.</div>`;$('#moves').innerHTML=state.transactions.length?state.transactions.map(x=>`<div class=tx><div class=txmain><b>${esc(x.description)}</b><small>${esc(x.category)} • ${new Date(x.occurredAt).toLocaleDateString('pt-BR')}</small></div><div class="amt ${x.type==='income'?'ok':'bad'}">${x.type==='income'?'+':'-'}${money(x.amountCents)}</div></div>`).join(''):'<div class=empty>Nenhum movimento ainda.</div>';let total=(s.categories||[]).reduce((a,x)=>a+x.amountCents,0)||1;$('#cats').innerHTML=s.categories?.length?s.categories.map(x=>`<div class=cat><div class=catline><b>${esc(x.category)}</b><span>${money(x.amountCents)}</span></div><div class=bar><i style="width:${Math.round(x.amountCents/total*100)}%"></i></div></div>`).join(''):'<div class=empty>Registre despesas para ver a distribuição.</div>';$('#alerts').innerHTML=state.alerts.length?state.alerts.map(x=>`<div class=alert><b>⚠️ ${esc(x.title)}</b><p>${esc(x.detail)}</p></div>`).join(''):'<div class=empty>Nenhum alerta relevante por enquanto.</div>';setTimeout(()=>scrollTo(0,document.body.scrollHeight),20)}
async function send(){let i=$('#msg'),text=i.value.trim();if(!text)return;i.value='';$('#composer').classList.add('busy');try{await api('/api/chat',{method:'POST',body:JSON.stringify({text})});await refresh()}catch(e){alert('Não consegui registrar agora.')}finally{$('#composer').classList.remove('busy')}}
$('#msg').addEventListener('keydown',e=>{if(e.key==='Enter')send()});$('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
function voice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Reconhecimento de voz não disponível neste navegador.');return}let r=new SR();r.lang='pt-BR';r.interimResults=false;$('#mic').textContent='●';r.onresult=e=>{$('#msg').value=e.results[0][0].transcript;send()};r.onerror=()=>alert('Não consegui ouvir. Tente novamente.');r.onend=()=>$('#mic').textContent='🎙️';r.start()}
function show(v,b){['chat','dash','moves','alerts'].forEach(x=>$('#'+x+'View').classList.toggle('hidden',x!==v));document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#composer').style.display=v==='chat'?'flex':'none';render()}
(async()=>{try{let b=await api('/api/me');me=b.user;enterApp();await refresh()}catch(e){$('#login').classList.remove('hidden')}})();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
