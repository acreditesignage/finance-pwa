<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08101f"><title>Finanças</title><style>:root{--bg:#07101f;--p:#101a2e;--p2:#15223b;--t:#f7f9ff;--m:#9aa8c0;--a:#4f8cff;--ok:#37d39a;--bad:#ff6b83;--line:#263553}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#07101f,#0a1221);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.shell{max-width:760px;margin:auto;padding:16px 14px 100px}.hidden{display:none!important}.login{min-height:82vh;display:grid;place-items:center;text-align:center}.logo{width:76px;height:76px;border-radius:24px;background:linear-gradient(135deg,#4f8cff,#765cff);display:grid;place-items:center;font-size:34px;margin:auto}.login h1{font-size:30px;margin:18px 0 6px}.login p{color:var(--m);max-width:430px;line-height:1.5}.people{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}.person,.btn{border:1px solid var(--line);background:var(--p);color:white;border-radius:18px;padding:18px;font-weight:700;font-size:16px}.person span{display:block;color:var(--m);font-size:12px;font-weight:500;margin-top:5px}.top{position:sticky;top:0;background:#07101fef;backdrop-filter:blur(16px);z-index:5;padding:12px 0;border-bottom:1px solid var(--line)}.row{display:flex;align-items:center;gap:10px}.brand{font-weight:800;font-size:18px}.sub{font-size:12px;color:var(--m)}.who{margin-left:auto;background:#16223a;border:1px solid var(--line);padding:7px 10px;border-radius:999px;font-size:12px}.logout{border:0;background:#1a2232;color:#dce5f5;border-radius:10px;padding:8px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.card{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:12px}.card small{display:block;color:var(--m);margin-bottom:6px}.ok{color:var(--ok)}.bad{color:var(--bad)}.hint{font-size:12px;color:#b6c3d8;background:#101a2c;border:1px dashed #34496e;padding:12px;border-radius:14px}.chat{display:flex;flex-direction:column;gap:9px;padding:12px 0 110px}.bubble{max-width:88%;padding:11px 13px;border-radius:17px;line-height:1.4;white-space:pre-wrap}.me{align-self:flex-end;background:#2c68df}.bot{align-self:flex-start;background:var(--p2);border:1px solid var(--line)}.composer{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;width:min(730px,calc(100% - 28px));display:flex;gap:8px;background:#0c1526;border:1px solid var(--line);padding:8px;border-radius:20px;z-index:10}.composer input{flex:1;background:transparent;border:0;color:white;outline:0;padding:10px;font-size:15px}.icon,.send{width:42px;height:42px;border:0;border-radius:14px;background:#192944;color:white;font-size:18px}.send{background:var(--a)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#08101fee;border-top:1px solid var(--line);padding:6px;z-index:12}.nav button{border:0;background:transparent;color:#8393ad;padding:8px;font-size:11px}.nav b{display:block;font-size:18px}.nav .active{color:#74a4ff}.section h2{font-size:20px}.tx,.cat,.alert{background:var(--p);border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:8px}.tx{display:flex;gap:10px;align-items:center}.txmain{flex:1}.txmain b{display:block;font-size:14px}.txmain small{color:var(--m)}.amt{font-weight:800}.catline{display:flex;justify-content:space-between}.bar{height:8px;background:#111a2d;border-radius:999px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#4f8cff,#50ddb3)}.alert p{margin:5px 0 0;color:#c0cadb;font-size:12px}.empty{text-align:center;color:var(--m);padding:30px 10px}@media(max-width:430px){.people{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.cards .card:last-child{grid-column:1/-1}}</style></head><body><div class="shell"><div id="login" class="login"><div><div class="logo">↗</div><h1>Seu dinheiro, em conversa.</h1><p>Registre entradas e gastos falando normalmente. Depois pergunte quanto gastou e onde seu dinheiro foi parar.</p><div class="people"><button class="person" onclick="loginAs('Thiago')">Thiago<span>Ambiente individual</span></button><button class="person" onclick="loginAs('Rebeca')">Rebeca<span>Ambiente individual</span></button></div></div></div><div id="app" class="hidden"><header class="top"><div class="row"><div><div class="brand">Finanças</div><div class="sub" id="hello"></div></div><div class="who" id="today"></div><button class="logout" onclick="logout()">Sair</button></div></header><div id="summary" class="cards"></div><main><section id="chatView"><div class="hint">Exemplos: “Gastei R$ 100 de diesel no posto”, “Recebi R$ 2.500 hoje”, “Quanto gastei no iFood este mês?”</div><div id="chat" class="chat"></div><div class="composer"><button class="icon" id="mic" onclick="voice()">🎙️</button><input id="msg" placeholder="Fale ou escreva sobre suas finanças…"><button class="send" onclick="send()">➤</button></div></section><section id="dashView" class="section hidden"><h2>Resumo do mês</h2><div id="cats"></div></section><section id="movesView" class="section hidden"><h2>Movimentos</h2><div id="moves"></div></section><section id="alertsView" class="section hidden"><h2>Radar financeiro</h2><div id="alerts"></div></section></main></div></div><nav id="nav" class="nav hidden"><button class="active" onclick="show('chat',this)"><b>💬</b>Chat</button><button onclick="show('dash',this)"><b>◫</b>Resumo</button><button onclick="show('moves',this)"><b>↕</b>Movimentos</button><button onclick="show('alerts',this)"><b>◎</b>Radar</button></nav><script>let user=localStorage.getItem('fp_user')||'';const $=s=>document.querySelector(s),money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n),mk=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')},k=n=>`fp_${user}_${n}`;function data(n,d=[]){try{return JSON.parse(localStorage.getItem(k(n)))||d}catch{return d}}function save(n,v){localStorage.setItem(k(n),JSON.stringify(v))}function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function loginAs(u){user=u;localStorage.setItem('fp_user',u);boot()}function logout(){localStorage.removeItem('fp_user');location.reload()}function boot(){if(!user)return;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#nav').classList.remove('hidden');$('#hello').textContent='Olá, '+user;$('#today').textContent=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});if(!data('chat').length)save('chat',[{who:'bot',text:`Olá, ${user}. Me diga uma entrada ou gasto. Eu organizo para você.`}]);render()}function txMonth(){return data('tx').filter(t=>t.date.slice(0,7)===mk())}function totals(){let inc=0,out=0;txMonth().forEach(x=>x.type==='income'?inc+=x.value:out+=x.value);return{inc,out,bal:inc-out}}function summary(){let t=totals();$('#summary').innerHTML=`<div class=card><small>Entradas</small><strong class=ok>${money(t.inc)}</strong></div><div class=card><small>Saídas</small><strong class=bad>${money(t.out)}</strong></div><div class=card><small>Saldo</small><strong class=${t.bal>=0?'ok':'bad'}>${money(t.bal)}</strong></div>`}function chat(){let el=$('#chat');el.innerHTML=data('chat').map(x=>`<div class="bubble ${x.who==='me'?'me':'bot'}">${esc(x.text)}</div>`).join('');setTimeout(()=>scrollTo(0,document.body.scrollHeight),20)}function cat(s){s=s.toLowerCase();if(/ifood|delivery|restaurante|lanche|pizza/.test(s))return'Alimentação';if(/diesel|gasolina|posto|combust/.test(s))return'Combustível';if(/mercado|supermercado/.test(s))return'Mercado';if(/farm|rem[eé]dio|medic/.test(s))return'Saúde';if(/uber|99|ped[aá]gio/.test(s))return'Transporte';if(/netflix|spotify|assinatura/.test(s))return'Assinaturas';return'Outros'}function value(s){let m=s.match(/(?:r\$\s*)?(\d{1,7}(?:[.,]\d{1,2})?)/i);return m?Number(m[1].replace('.','').replace(',','.')):0}function add(type,v,desc){let a=data('tx');a.unshift({id:Date.now(),type,value:v,desc,cat:cat(desc),date:new Date().toISOString()});save('tx',a)}function reply(t){let c=data('chat');c.push({who:'bot',text:t});save('chat',c)}function query(s){let l=s.toLowerCase(),a=txMonth();if(/quanto.*(?:entrou|recebi|entrada)/.test(l))return`Entrou ${money(a.filter(x=>x.type==='income').reduce((p,x)=>p+x.value,0))} neste mês.`;if(/saldo/.test(l))return`Seu saldo do mês está em ${money(totals().bal)}.`;if(/maior.*despesa/.test(l)){let x=a.filter(x=>x.type==='expense').sort((x,y)=>y.value-x.value)[0];return x?`Sua maior despesa do mês foi ${money(x.value)} — ${x.desc}.`:'Ainda não há despesas neste mês.'}if(/quanto.*gast/.test(l)){let term='',m=l.match(/(?:com|de|no|na)\s+(.+?)(?:\s+(?:esse|este|neste)\s+m[eê]s)?[?.!]*$/);if(m)term=m[1].trim();let arr=a.filter(x=>x.type==='expense');if(term&&!['mês','mes'].includes(term))arr=arr.filter(x=>(x.desc+' '+x.cat).toLowerCase().includes(term));let v=arr.reduce((p,x)=>p+x.value,0);return term?`Você gastou ${money(v)} com ${term} neste mês.`:`Você gastou ${money(v)} neste mês.`}return''}function handle(s){let q=query(s);if(q)return reply(q);let v=value(s),l=s.toLowerCase();if(v&&/gastei|paguei|comprei|abasteci|saiu/.test(l)){add('expense',v,s);return reply(`Registrei ${money(v)} como despesa em ${cat(s)}.`)}if(v&&/recebi|entrou|ganhei|caiu|vendi/.test(l)){add('income',v,s);return reply(`Registrei ${money(v)} como entrada.`)}reply('Não consegui transformar isso em lançamento. Tente: “Gastei R$ 80 no mercado” ou pergunte “quanto gastei este mês?”.')}function send(){let i=$('#msg'),s=i.value.trim();if(!s)return;let c=data('chat');c.push({who:'me',text:s});save('chat',c);i.value='';handle(s);render()}$('#msg').addEventListener('keydown',e=>{if(e.key==='Enter')send()});function voice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){reply('O reconhecimento de voz não está disponível neste navegador. Você pode digitar normalmente.');return render()}let r=new SR();r.lang='pt-BR';r.interimResults=false;$('#mic').textContent='●';r.onresult=e=>{$('#msg').value=e.results[0][0].transcript;$('#mic').textContent='🎙️';send()};r.onerror=()=>{$('#mic').textContent='🎙️';reply('Não consegui ouvir. Tente novamente.');render()};r.onend=()=>$('#mic').textContent='🎙️';r.start()}function moves(){let a=data('tx');$('#moves').innerHTML=a.length?a.map(x=>`<div class=tx><div class=txmain><b>${esc(x.desc)}</b><small>${x.cat} • ${new Date(x.date).toLocaleDateString('pt-BR')}</small></div><div class="amt ${x.type==='income'?'ok':'bad'}">${x.type==='income'?'+':'-'}${money(x.value)}</div></div>`).join(''):'<div class=empty>Nenhum movimento ainda.</div>'}function cats(){let a=txMonth().filter(x=>x.type==='expense'),m={};a.forEach(x=>m[x.cat]=(m[x.cat]||0)+x.value);let total=Object.values(m).reduce((p,x)=>p+x,0)||1;$('#cats').innerHTML=Object.keys(m).length?Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class=cat><div class=catline><b>${c}</b><span>${money(v)}</span></div><div class=bar><i style="width:${Math.round(v/total*100)}%"></i></div></div>`).join(''):'<div class=empty>Registre despesas para ver a distribuição.</div>'}function alerts(){let a=txMonth().filter(x=>x.type==='expense'),m={};a.forEach(x=>m[x.cat]=(m[x.cat]||0)+x.value);let out=[],total=a.reduce((p,x)=>p+x.value,0);Object.entries(m).forEach(([c,v])=>{if(total&&v/total>.45)out.push({t:`${c} concentra ${Math.round(v/total*100)}% das despesas`,p:`Foram ${money(v)} neste mês.`})});let avg=a.length?a.reduce((p,x)=>p+x.value,0)/a.length:0;a.filter(x=>a.length>=4&&x.value>avg*2.5).slice(0,2).forEach(x=>out.push({t:'Gasto acima do seu padrão',p:`${money(x.value)} — ${x.desc}`}));$('#alerts').innerHTML=out.length?out.map(x=>`<div class=alert><b>⚠️ ${esc(x.t)}</b><p>${esc(x.p)}</p></div>`).join(''):'<div class=empty>Nenhum alerta relevante por enquanto.</div>'}function render(){summary();chat();moves();cats();alerts()}function show(v,b){['chat','dash','moves','alerts'].forEach(x=>$('#'+x+'View').classList.toggle('hidden',x!==v));document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('.composer').style.display=v==='chat'?'flex':'none';render()}boot();</script></body></html>
